<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>TGE Gmail sender key</title><style>body{font:16px/1.6 system-ui;max-width:650px;margin:50px auto;padding:20px;background:#10131a;color:#eee}button,textarea{font:inherit;padding:12px}textarea{box-sizing:border-box;width:100%;margin:20px 0;background:#202632;color:#fff;overflow-wrap:anywhere}button{cursor:pointer}</style><h1>TGE Gmail sender key</h1><p>Generate a separate key for the Gmail sender. Copy it into Google Apps Script’s <b>TGE_EMAIL_SECRET</b> property and GitHub’s <b>GMAIL_SENDER_SECRET</b> secret. Keep your staff owner login code separate.</p><button id="generate">Generate a new sender key</button><textarea id="secret" readonly aria-label="Private sender key" rows="3" autocomplete="off" spellcheck="false"></textarea><p>This offline page makes no network requests and saves nothing. Keep this key private.</p><script>document.getElementById('generate').onclick=()=>{document.getElementById('secret').value=Array.from(crypto.getRandomValues(new Uint8Array(32)),n=>n.toString(16).padStart(2,'0')).join('');};</script></html>
