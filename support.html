<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><meta name="robots" content="noindex"><title>Support Center | The Galactic Empire</title><style>body{margin:0;min-height:100vh;background:#08090c;color:#f4f6fc;display:grid;place-items:center;font:14px/1.8 Arial,sans-serif}main{width:min(560px,calc(100% - 60px));padding:35px;border:1px solid #402734;background:#14121b;box-sizing:border-box}small{color:#ff798d;letter-spacing:.15em;font-size:10px}h1{font-size:29px;line-height:1.3}p{color:#afb9cc}a{display:inline-block;color:white;border:1px solid #ef2535;background:#ef2535;padding:12px 18px;text-decoration:none}a.secondary{background:transparent;border-color:#3b4b63;margin-left:8px}</style></head><body><main><small>IMPERIAL SUPPORT DIRECTORATE</small><h1>Your voice. Our priority.</h1><p id="status">Opening the TGE Support Center… If you are not redirected, use the button below.</p><a id="continue" href="https://tge-support.pages.dev/">Open Support Center ↗</a><a class="secondary" href="./">Empire website</a></main><script>const target=new URL('https://tge-support.pages.dev/');const q=new URLSearchParams(location.search);const c=q.get('category');if(['careers','reports','general','appeals'].includes(c))target.searchParams.set('category',c);if(['track','mine','guides'].includes(q.get('view')))target.searchParams.set('view',q.get('view'));document.getElementById('continue').href=target.href;location.replace(target.href);</script></body></html>
